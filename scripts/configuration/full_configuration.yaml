# =============================================================================
# BetaDogma Whole Genome Data Pipeline Configuration
# =============================================================================
# Full production configuration for processing all chromosomes (chr1-chr22, chrX, chrY)
#
# This config supports both:
#   1. download_data.py      - Downloads and verifies raw data
#   2. prepare_training_data.py - Processes raw data into training format
#
# All relative paths are resolved relative to THIS FILE's location.
# =============================================================================

# -----------------------------------------------------------------------------
# COMMON SETTINGS
# -----------------------------------------------------------------------------
name: "whole_genome_full"
genome_build: GRCh38
chromosome: ""  # Empty string = all chromosomes (chr1-chr22, chrX, chrY)
seed: 42

# -----------------------------------------------------------------------------
# DIRECTORIES (relative to this config file)
# -----------------------------------------------------------------------------
paths:
  # Raw downloaded data (output of download_data.py)
  raw: "../../data/raw"
  
  # Intermediate processed data (working directory)
  # Note: This will be large (~100s of GB)
  cache: "../../data/cache/whole_genome"
  
  # Final training-ready data (output of prepare_training_data.py)
  output: "../../data/processed/whole_genome"

# -----------------------------------------------------------------------------
# DOWNLOAD CONFIGURATION (used by download_data.py)
# -----------------------------------------------------------------------------
download:
  # Whether to skip files that already exist and pass checksum
  skip_existing: true
  
  # Retry settings for large files
  max_retries: 5
  timeout: 600  # 10 minutes for large files
  chunk_size: 8388608  # 8MB chunks
  
  # Data sources
  sources:
    # Reference genome (whole genome assembly)
    genome:
      base_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_44"
      files:
        - filename: "GRCh38.primary_assembly.genome.fa.gz"
          checksum: "e9a2d5a5cd225293646ae298998ad4ea8c11e8f22729bc2d6f5c3dcfefbf8ef8"
          output_path: "genome/GRCh38.primary_assembly.genome.fa.gz"
          size_bytes: 938553757  # ~895 MB
          decompress: true  # Auto-decompress for processing
          create_index: true  # Create .fai index with samtools/pyfaidx
    
    # GENCODE annotations (all chromosomes)
    gencode:
      release: 44
      base_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_44"
      files:
        - filename: "gencode.v44.annotation.gtf.gz"
          checksum: "01f817afed65feee863361b4baf30a95e722ee5c5d508ff77b04106ef7ba20d3"
          output_path: "gencode/gencode.v44.annotation.gtf.gz"
          size_bytes: 49442327  # ~47 MB
          decompress: true
    
    # GTEx expression data (all tissues, all samples)
    gtex:
      base_url: "https://storage.googleapis.com/adult-gtex"
      files:
        # Junction read counts (all chromosomes)
        - filename: "GTEx_Analysis_2017-06-05_v8_STARv2.5.3a_junctions.gct.gz"
          url_path: "bulk-gex/v8/rna-seq/GTEx_Analysis_2017-06-05_v8_STARv2.5.3a_junctions.gct.gz"
          checksum: "d3b09e46856a33f390ec59c1d2bc7b65589cf50f20dabf1d0759093966d3a602"
          output_path: "gtex/junctions/GTEx_junctions.gct.gz"
          size_bytes: 2400000000  # ~2.4 GB
        
        # Gene TPM expression values
        - filename: "GTEx_Analysis_2017-06-05_v8_RNASeQCv1.1.9_gene_tpm.gct.gz"
          url_path: "bulk-gex/v8/rna-seq/GTEx_Analysis_2017-06-05_v8_RNASeQCv1.1.9_gene_tpm.gct.gz"
          checksum: "ec783825ebebb8ba8525b73cb7ff9577162bc0d2e8a7fdc408283b7639c306fb"
          output_path: "gtex/expression/GTEx_gene_tpm.gct.gz"
          size_bytes: 126000000  # ~126 MB
        
        # Sample metadata
        - filename: "GTEx_Analysis_v8_Annotations_SampleAttributesDS.txt"
          url_path: "annotations/v8/metadata-files/GTEx_Analysis_v8_Annotations_SampleAttributesDS.txt"
          checksum: "74f6ab4c34ed2648d708a0ae6e6dff324f6c86ea723ae7d1c37d76f5221148f0"
          output_path: "gtex/metadata/GTEx_samples.txt"
          size_bytes: 8800000  # ~8.8 MB
        
        # Subject phenotypes (optional but useful for QC)
        - filename: "GTEx_Analysis_v8_Annotations_SubjectPhenotypesDS.txt"
          url_path: "annotations/v8/metadata-files/GTEx_Analysis_v8_Annotations_SubjectPhenotypesDS.txt"
          checksum: null  # Add if you have it
          output_path: "gtex/metadata/GTEx_phenotypes.txt"
          required: false
    
    # Variant data (1000 Genomes Phase 3 - ALL CHROMOSOMES)
    variants:
      base_url: "https://ftp.ensembl.org/pub/current_variation/vcf/homo_sapiens"
      files:
        # Whole genome VCF with all chromosomes
        - filename: "1000GENOMES-phase_3.vcf.gz"
          checksum: "b54f496abcab3ab11f9b4991751f48c142b723a834d66a039772236824476928"
          output_path: "variants/1000GENOMES-phase_3.vcf.gz"
          size_bytes: 2500000000  # ~2.5 GB
        
        # Tabix index for efficient chromosome/region queries
        - filename: "1000GENOMES-phase_3.vcf.gz.csi"
          checksum: null  # Index files typically don't have published checksums
          output_path: "variants/1000GENOMES-phase_3.vcf.gz.csi"
          required: false  # Will be created locally if missing
          size_bytes: 500000  # ~500 KB

# -----------------------------------------------------------------------------
# PROCESSING CONFIGURATION (used by prepare_training_data.py)
# -----------------------------------------------------------------------------
processing:
  
  # Step 1: Prepare GENCODE windows (base non-overlapping windows)
  # This creates the foundational genomic windows across all chromosomes
  gencode:
    enabled: true
    kwargs:
      fasta: "{paths.raw}/genome/GRCh38.primary_assembly.genome.fa"
      gtf: "{paths.raw}/gencode/gencode.v44.annotation.gtf"
      out: "{paths.cache}/gencode_windows_base"
      window: 131072        # 128k windows (2^17)
      stride: 131072        # Non-overlapping for base windows (stride = window)
      bin_size: 1           # Base-resolution labels to match NTEncoder
      chroms: ""            # Empty = process all chromosomes (chr1-chr22, chrX, chrY)
      max_shard_bases: 100000000  # 100 MB per shard (larger for whole genome efficiency)
      
      # Optional: chromosome filter list (uncomment to exclude chrY, chrM, etc.)
      # include_chroms: ["chr1", "chr2", "chr3", "chr4", "chr5", "chr6", "chr7", 
      #                  "chr8", "chr9", "chr10", "chr11", "chr12", "chr13", "chr14",
      #                  "chr15", "chr16", "chr17", "chr18", "chr19", "chr20", "chr21",
      #                  "chr22", "chrX"]
  
  # Step 2: Prepare GTEx junction data (all chromosomes)
  gtex:
    enabled: true
    kwargs:
      junctions: "{paths.raw}/gtex/junctions/GTEx_junctions.gct.gz"
      gtf: "{paths.raw}/gencode/gencode.v44.annotation.gtf"
      out: "{paths.cache}/gtex_psi"
      chroms: ""            # Process all chromosomes
      
      # Higher thresholds for whole genome (more stringent filtering)
      min_count: 5          # ≥5 reads per junction (more confident calls)
      min_total: 50         # ≥50 total reads across all samples
      min_samples: 10       # Require junction in ≥10 samples (more reproducible)
      
      # Quality filters
      max_intron_length: 500000  # 500kb max intron size
      min_intron_length: 20      # 20bp min intron size
      
      # Performance
      smoke: false          # Set to true for quick testing on subset
      n_jobs: -1           # Use all CPU cores for parallel processing
  
  # Step 3: Add variants to base windows (non-overlapping)
  # Uses whole genome VCF, processes all chromosomes in windows
  variants:
    enabled: true
    kwargs:
      vcf: "{paths.raw}/variants/1000GENOMES-phase_3.vcf.gz"
      windows: "{paths.cache}/gencode_windows_base/*.parquet"
      out: "{paths.cache}/variants_base"
      
      # Variant application settings
      apply_alt: true       # Apply alternative alleles to sequence
      
      # Filtering thresholds
      max_per_window: 50    # Max 50 variants per window (more stringent than chr22)
      min_af: 0.01          # Minimum allele frequency 1% (filter rare variants)
      max_af: 0.99          # Maximum allele frequency 99% (filter fixed variants)
      
      # Performance settings
      shard_size: 50000     # Process 50k windows per shard (larger for efficiency)
      n_jobs: -1            # Parallel processing across CPU cores
      
      # Quality filters
      min_qual: 30          # Minimum variant QUAL score
      filter_pass: true     # Only use PASS variants
      
      seed: "{seed}"
      debug: false
  
  # Step 4: Create overlapping windows from base windows
  # This enables sliding window predictions at inference time
  overlapping_windows:
    enabled: true
    kwargs:
      base_windows: "{paths.cache}/variants_base"
      out: "{paths.cache}/variants_overlapping"
      stride: 65536         # 64k stride = 50% overlap for 128k windows
      
      # Reuse variants from base windows (efficient!)
      reuse_variants: true
      
      # Performance
      shard_size: 50000     # Process 50k windows per shard
      n_jobs: -1
      
      seed: "{seed}"
      debug: false
  
  # Step 5: Aggregate all data into final training format
  # Merges gencode windows, GTEx data, and variants
  aggregate:
    enabled: true
    kwargs:
      input_dir: "{paths.cache}/gencode_windows_base"
      output_dir: "{paths.output}"
      gtex_dir: "{paths.cache}/gtex_psi"
      variant_dir: "{paths.cache}/variants_overlapping"
      
      # Output format
      write_index: true     # Create index for fast loading
      split_by: "chrom"     # Split output by chromosome
      format: "parquet"     # Use Parquet for efficient storage
      compression: "snappy" # Fast compression
      
      # Column selection (keep only what's needed for training)
      keep_columns:
        - chrom
        - start
        - end
        - seq              # DNA sequence
        - donor            # Donor splice site labels
        - acceptor         # Acceptor splice site labels
        - tss              # Transcription start site labels
        - polya            # Poly(A) site labels
        - psi              # Junction PSI values (from GTEx)
        - variant_mask     # Which bases have variants
        - variant_info     # Variant metadata
      
      # Additional filtering
      max_variants_per_window: 0  # 0 = no additional downsampling
      min_coverage: 0.5           # Require ≥50% of window covered by genes
      
      # Quality control
      validate: true              # Validate output integrity
      write_stats: true           # Write summary statistics
      
      # Performance
      n_jobs: -1

# -----------------------------------------------------------------------------
# RESOURCE MANAGEMENT
# -----------------------------------------------------------------------------
resources:
  # Expected disk space requirements
  disk_space:
    raw: "10 GB"           # Raw downloaded files
    cache: "500 GB"        # Intermediate processing (can be large!)
    output: "200 GB"       # Final training data
    total: "710 GB"        # Total estimated
  
  # Expected memory requirements per step
  memory:
    gencode: "16 GB"       # Peak memory for gencode processing
    gtex: "32 GB"          # GTEx can be memory intensive
    variants: "16 GB"      # Per-worker memory
    overlapping: "8 GB"
    aggregate: "32 GB"     # Peak during merging
  
  # Recommended CPU cores
  cpus: 16                 # Recommended minimum for whole genome
  
  # Expected runtime (on 16-core machine)
  estimated_time:
    download: "2-4 hours"  # Depends on network speed
    gencode: "4-6 hours"
    gtex: "6-8 hours"
    variants: "24-48 hours"  # Most time-consuming step
    overlapping: "8-12 hours"
    aggregate: "12-24 hours"
    total: "3-5 days"      # Total pipeline runtime

# -----------------------------------------------------------------------------
# VALIDATION (used to check outputs after each step)
# -----------------------------------------------------------------------------
validation:
  # Expected outputs after each step
  expected_outputs:
    download:
      - "{paths.raw}/genome/GRCh38.primary_assembly.genome.fa"
      - "{paths.raw}/genome/GRCh38.primary_assembly.genome.fa.fai"
      - "{paths.raw}/gencode/gencode.v44.annotation.gtf"
      - "{paths.raw}/gtex/junctions/GTEx_junctions.gct.gz"
      - "{paths.raw}/variants/1000GENOMES-phase_3.vcf.gz"
      - "{paths.raw}/variants/1000GENOMES-phase_3.vcf.gz.csi"
    
    gencode:
      - "{paths.cache}/gencode_windows_base/shard_*.parquet"
      - "{paths.cache}/gencode_windows_base/metadata.json"
    
    gtex:
      - "{paths.cache}/gtex_psi/*.parquet"
      - "{paths.cache}/gtex_psi/metadata.json"
    
    variants:
      - "{paths.cache}/variants_base/shard_*.parquet"
      - "{paths.cache}/variants_base/metadata.json"
    
    overlapping_windows:
      - "{paths.cache}/variants_overlapping/shard_*.parquet"
      - "{paths.cache}/variants_overlapping/metadata.json"
    
    aggregate:
      - "{paths.output}/chr*.parquet"
      - "{paths.output}/index.json"
      - "{paths.output}/statistics.json"
  
  # Minimum expected counts
  minimum_counts:
    gencode_windows: 20000    # At least 20k windows across genome
    gtex_junctions: 50000     # At least 50k junctions
    variants: 10000000        # At least 10M variants
    final_windows: 40000      # At least 40k final windows (with overlapping)

# -----------------------------------------------------------------------------
# LOGGING AND MONITORING
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  file: "{paths.output}/pipeline.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Progress tracking
  progress_bar: true
  checkpoint_frequency: 1000  # Save checkpoint every N items
  
  # Performance metrics
  track_memory: true
  track_time: true
  profile: false  # Set to true for detailed profiling

# -----------------------------------------------------------------------------
# CHECKPOINTING (for resumable processing)
# -----------------------------------------------------------------------------
checkpoints:
  enabled: true
  dir: "{paths.cache}/checkpoints"
  save_frequency: 5000  # Save state every N windows
  
  # Restart behavior
  auto_resume: true     # Automatically resume from last checkpoint
  validate_on_resume: true  # Verify checkpoint integrity

# -----------------------------------------------------------------------------
# EXPERIMENTAL / ADVANCED OPTIONS
# -----------------------------------------------------------------------------
advanced:
  # Sequence augmentation (optional)
  augmentation:
    enabled: false
    reverse_complement: true
    random_shift: 0
  
  # Multi-genome support (future)
  additional_genomes: []
  
  # Custom features
  custom_labels: []
  
  # Distributed processing (future)
  distributed:
    enabled: false
    backend: "dask"  # or "ray", "spark"
    scheduler: null