# train.base.yaml
seed: 42
task: structural

data:
  train_parquet_glob: ../../data/processed/chr21/train/chr21.parquet
  val_parquet_glob:   ../../data/processed/chr21/test/chr21.parquet
  batch_size: 2
  num_workers: 2
  validate_numerical_stability: true

model:
  freeze_encoder: true
  encoder:
    model_id: InstaDeepAI/nucleotide-transformer-500m-human-ref
    hidden_size: 1280
  heads:
    hidden: 512
    use_conv: true
    dropout: 0.2
  loss:
    pos_weight: 25.0
    w_splice: 1.0
    w_tss: 0.5
    w_polya: 0.5
    w_consistency: 0.1
    w_disruption: 0.5
  decoder: {}

optim:
  lr: 5e-5  # Further reduced for better stability
  weight_decay: 0.01
  gradient_clip_val: 0.5  # More aggressive clipping

trainer:
  gradient_clip_val: 0.5  # Consistent with optim setting

lr_scheduler:
  name: "ReduceLROnPlateau"
  mode: "min"
  factor: 0.5
  patience: 2
  min_lr: 1e-6