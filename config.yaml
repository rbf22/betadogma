data:
  reference_fasta: "data/processed/genome/GRCh38.fa.gz"
  gencode_gtf: "data/processed/annotation/gencode_v26/gencode.v26.annotation.gtf.gz"
  clinvar_vcf: "data/processed/variants/clinvar/clinvar.vcf.gz"
  splicevar_vcf: "data/processed/variants/splicevar/splicevar_hg38.vcf.gz"
  thousand_genomes_vcf: "data/processed/variants/1000genomes/1000GENOMES-phase_3.vcf.gz"
  gtex_junctions: "data/processed/gtex/v8/junctions/junctions_filtered.parquet"
  gtex_expression: "data/processed/gtex/v8/expression/transcript_tpm_summary.parquet"
  protein_fasta: "data/processed/annotation/gencode_v26/gencode.v26.pc_translations.fa.gz"
  transcript_fasta: "data/processed/annotation/gencode_v26/gencode.v26.transcripts.fa.gz"
  max_clinvar_variants: 10000000
  max_benign_variants: 10000000
  window_size: 130000
  step_size: 65000
  batch_size: 200
  gtex_sample_min: 50
  use_multiprocessing: false
  data_dir: "data/processed"
  cache_dir: "data/cache"

model:
  name: "kuleshov-group/caduceus-ps_seqlen-131k_d_model-256_n_layer-16"
  hidden_size: 512  # RCPS doubles the base d_model (256 -> 512)
  num_layers: 16
  max_seq_len: 131072  # Respect Caduceus-PS context window
  
  # Smaller prediction heads for MPS memory efficiency
  splice_hidden: 64   # Was 128
  tss_hidden: 32      # Was 64
  polya_hidden: 32    # Was 64
  protein_hidden: 64  # Was 256
  
  # Memory optimization tuned for 131k context
  use_gradient_checkpointing: false  # Caduceus remote code lacks checkpoint hooks
  encoder_chunk_size: 131072
  prediction_chunk_size: 65536
  chunk_overlap: 2048
  auto_chunk: true  # Automatically decide chunking strategy

training:
  # Data loading
  batch_size: 1  # Keep at 1 for very long sequences
  num_workers: 4
  limit_val_batches: 10
  limit_train_batches: 180
  
  # Optimization
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_epochs: 10
  gradient_clip_val: 1.0
  accumulate_grad_batches: 32  # Large accumulation for MPS (was 8)
  
  # Performance and precision
  precision: "16-mixed"  # Use full precision on MPS (mixed precision can be buggy)
  devices: 1  # MPS only supports 1 device
  compile_model: false  # Set to true for torch.compile speedup (disable for debugging)
  
  # Logging
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  verbose_batches: false  # Set to true to see detailed batch info during training
  
  # Checkpointing
  save_top_k: 3
  monitor: "val/loss/total"
  mode: "min"
  patience: 5
  
  # Encoder
  freeze_encoder: true  # Freeze HyenaDNA encoder weights

output:
  output_dir: "outputs"
  log_dir: "logs"
  checkpoint_dir: "checkpoints"

# GPU Configuration (auto-detected)
gpu:
  empty_cache_freq: 1  # Clear cache every N batches