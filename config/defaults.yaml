# BetaDogma Default Configuration
# This file contains default configuration values for the project.

project:
  name: "betadogma"
  version: "0.1.0"
  description: "BetaDogma - Splicing Variant Effect Predictor"

data:
  # Directory structure
  dirs:
    raw: "data/raw"
    processed: "data/processed"
    references: "data/references"
    cache: "data/cache"
  
  # File naming conventions
  naming:
    vcf: "{source}_{assembly}_{chrom}.vcf.gz"
    bam: "{sample}_{assembly}.bam"
    bai: "{bam}.bai"
    fasta: "{assembly}.fa"
    fai: "{fasta}.fai"
    gtf: "{source}_{assembly}_{version}.gtf"
    
  # Reference data
  reference:
    assembly: "GRCh38"
    source: "GENCODE"
    version: "v44"
  
  # Chromosome handling
  chromosomes:
    # Standard chromosomes to include (None = all)
    include: null
    
    # Chromosomes to exclude (overrides include)
    exclude: ["chrM", "chrY"]
    
    # Include sex chromosomes (X, Y)
    include_sex_chromosomes: true
    
    # Chromosome naming convention (ucsc or ncbi)
    naming_convention: "ucsc"

# Processing parameters
processing:
  # Number of parallel workers (0 = use all available cores)
  threads: 0
  
  # Memory limit per worker (in GB)
  memory_per_worker_gb: 4
  
  # Batch size for variant processing
  batch_size: 1000

# Model parameters
model:
  # Default model architecture
  architecture: "transformer"
  
  # Input sequence length
  sequence_length: 1000
  
  # Number of attention heads
  num_heads: 8
  
  # Number of transformer layers
  num_layers: 6
  
  # Hidden dimension size
  hidden_dim: 512
  
  # Dropout rate
  dropout: 0.1

# Training parameters
training:
  # Batch size for training
  batch_size: 32
  
  # Number of training epochs
  epochs: 50
  
  # Learning rate
  learning_rate: 1e-4
  
  # Weight decay
  weight_decay: 1e-5
  
  # Early stopping patience (epochs)
  patience: 10
  
  # Minimum learning rate
  min_lr: 1e-6

# Logging and output
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"
  
  # Log file path (None for console only)
  file: "logs/betadogma.log"
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Output directory for model checkpoints and results
  output_dir: "results"

# External tools and dependencies
tools:
  # Path to tabix (if not in PATH)
  tabix: "tabix"
  
  # Path to bgzip (if not in PATH)
  bgzip: "bgzip"
  
  # Path to samtools (if not in PATH)
  samtools: "samtools"
  
  # Path to bcftools (if not in PATH)
  bcftools: "bcftools"
